# ComputeWarden configuration.
#
# The daemon looks for this file at:
#   %ProgramData%\ComputeWarden\config.yaml
# or wherever the COMPUTEWARDEN_CONFIG environment variable points.
# If no file is found, built-in defaults are used.
#
# Hot-reload: editing process_rules (incl. resources), the debounce (busy_after_ms / available_after_ms),
# or sharing takes effect within ~1s while the daemon is running - no restart needed. Changing
# poll_interval_ms, leases, allow_manual_blocker, or logging still requires a restart.

server:
  # Fallback process poll interval if process_detection.poll_interval_ms is unset.
  poll_interval_ms: 2000

leases:
  default_seconds: 300   # lease length when a client doesn't specify one
  minimum_seconds: 30    # requests below this are clamped up
  maximum_seconds: 3600  # requests above this are clamped down

process_detection:
  poll_interval_ms: 2000
  busy_after_ms: 0        # delay before a newly-seen process counts as a blocker
  available_after_ms: 3000 # keep BUSY this long after a matched process exits (debounce)

# Cooperating agents will see the machine as BUSY whenever any enabled rule matches.
# A matched process is a *priority* claim (the user's own lease, e.g. a game): every agent
# on its resources is throttled or queued while it runs, in every mode.
# Optional per rule: `resources` = which of cpu, gpu, ram, network, disk the process occupies.
# Agents asking only for other resources can still proceed. Omit it to block everything.
process_rules:
  - name: Visual Studio Build
    executable: MSBuild.exe
    enabled: true
  - name: CodeCompass Indexer
    executable: CodeCompass.exe
    enabled: true
  - name: CodeCarver
    executable: CodeCarver.exe
    enabled: true
    resources: [ram, disk]   # memory-heavy analyzer: CPU/GPU work can still run

# Shared work and the line (agent claims with a kind). All advisory: agents apply it themselves.
sharing:
  # What "throttled" tells an agent: run on at most this many cores, at this priority
  # (below_normal or idle), using at most this much memory.
  throttle_max_cores: 1
  throttle_priority: below_normal
  throttle_max_ram_gb: 2
  # At most this many new claims run throttled per contended resource; later ones queue.
  # Work already running is never queued, only throttled.
  max_throttled_per_resource: 3
  # Resources that can't run small beside a holder: contended claims are queued instead.
  # [] makes everything shareable.
  unshareable: [gpu]
  # A queued ticket must check in (renew) at least this often or it drops out of line.
  queue_checkin_seconds: 120

# Set false to forbid clients from setting/clearing the manual blocker over MCP.
allow_manual_blocker: true

logging:
  level: info   # debug | info | warn | error
